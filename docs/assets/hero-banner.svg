<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#FF9E00"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glow -->
  <circle cx="200" cy="120" r="180" fill="#FF6B00" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="220" fill="#00F0FF" opacity="0.1" filter="url(#glow)"/>

  <!-- Top Badge -->
  <g transform="translate(60, 48)">
    <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#10B981"/>
    <text x="32" y="21" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">🇮🇳 AGENTANTRA • SOVEREIGN AI</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="145" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">Liate</text>
  
  <text x="240" y="145" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700">Platform</text>

  <!-- Subtitle -->
  <text x="60" y="195" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">
    India's Sovereign AI Agents Platform &amp; Universal Multi-Language ADK
  </text>
  <text x="60" y="228" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">
    5-Pillar Spec Engine (L-I-A-T-E) • Native Bun + Hono • Sarvam AI 105B • 51 Sovereign OOP Classes
  </text>

  <!-- Feature Cards -->
  <g transform="translate(60, 265)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="255" height="105" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="32" cy="32" r="14" fill="#FF6B00" fill-opacity="0.2"/>
      <text x="25" y="38" fill="#FF9E00" font-size="14">⚡</text>
      <text x="58" y="36" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Sub-ms Runtime</text>
      <text x="20" y="68" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Bun 1.3 + Hono 4.13</text>
      <text x="20" y="88" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">&lt;1ms HTTP LAPI/v1</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(275, 0)">
      <rect width="255" height="105" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="32" cy="32" r="14" fill="#10B981" fill-opacity="0.2"/>
      <text x="25" y="38" fill="#10B981" font-size="14">🇮🇳</text>
      <text x="58" y="36" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Sarvam AI Native</text>
      <text x="20" y="68" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Sarvam 105B Indic Models</text>
      <text x="20" y="88" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Exact ₹ paise rate cards</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(550, 0)">
      <rect width="255" height="105" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="32" cy="32" r="14" fill="#00F0FF" fill-opacity="0.2"/>
      <text x="25" y="38" fill="#00F0FF" font-size="14">🔌</text>
      <text x="58" y="36" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Universal MCP &amp; ADK</text>
      <text x="20" y="68" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">TS, Python, Go, Java, Rust</text>
      <text x="20" y="88" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">OAuth 2.1 Edge Gateway</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(825, 0)">
      <rect width="255" height="105" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="32" cy="32" r="14" fill="#8B5CF6" fill-opacity="0.2"/>
      <text x="25" y="38" fill="#A78BFA" font-size="14">🛡️</text>
      <text x="58" y="36" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">DPDP Act Ready</text>
      <text x="20" y="68" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Aadhaar/PAN PII Redaction</text>
      <text x="20" y="88" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Sandboxed Sovereign State</text>
    </g>
  </g>
</svg>
