<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="360" rx="14" fill="url(#bgGrad2)" stroke="#334155" stroke-width="1"/>

  <!-- Section Title -->
  <text x="40" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Liate Platform — Sovereign Liate ID Workspaces &amp; MicroVM Cloud</text>
  <text x="40" y="74" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">1-Command Deployment from Local Studio to Isolated MicroVM Sandbox on ap-south-1 (Mumbai)</text>

  <!-- Step 1: Local Dev -->
  <g transform="translate(40, 105)">
    <rect width="280" height="210" rx="12" fill="url(#boxGrad)" stroke="#475569" stroke-width="1.2"/>
    <rect x="0" y="0" width="280" height="36" rx="12" fill="#334155" fill-opacity="0.5"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>
    <text x="75" y="23" fill="#E2E8F0" font-family="monospace" font-size="12">Local Studio (Liate)</text>
    
    <text x="20" y="68" fill="#FF9E00" font-family="monospace" font-size="13" font-weight="bold">$ liate init</text>
    <text x="20" y="92" fill="#94A3B8" font-family="monospace" font-size="12">├── liate.json (5-Pillar)</text>
    <text x="20" y="112" fill="#94A3B8" font-family="monospace" font-size="12">├── app.ts (OOP Agents)</text>
    <text x="20" y="132" fill="#94A3B8" font-family="monospace" font-size="12">└── skills/ &amp; mcps/</text>
    
    <rect x="20" y="152" width="240" height="38" rx="8" fill="#0f172a" stroke="#FF6B00" stroke-width="1"/>
    <text x="35" y="176" fill="#FF6B00" font-family="monospace" font-size="13" font-weight="bold">$ liate connect</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(330, 200)">
    <path d="M 0 0 L 55 0" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="55,-6 67,0 55,6" fill="#00F0FF"/>
    <text x="10" y="-12" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Encrypted TLS</text>
  </g>

  <!-- Step 2: Liate ID Workspace -->
  <g transform="translate(410, 105)">
    <rect width="320" height="210" rx="12" fill="url(#boxGrad)" stroke="#00F0FF" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="36" rx="12" fill="#00F0FF" fill-opacity="0.15"/>
    <text x="20" y="24" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">🆔 Liate ID MicroVM Workspace</text>
    
    <text x="20" y="68" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">ID: <tspan fill="#38BDF8">@developer.liate.id</tspan></text>
    
    <g transform="translate(20, 85)">
      <rect width="280" height="28" rx="6" fill="#1e293b"/>
      <text x="10" y="19" fill="#94A3B8" font-family="monospace" font-size="11">🔒 Encrypted Key Vault (AES-256)</text>
    </g>
    <g transform="translate(20, 120)">
      <rect width="280" height="28" rx="6" fill="#1e293b"/>
      <text x="10" y="19" fill="#94A3B8" font-family="monospace" font-size="11">⚡ Firecracker KVM MicroVM Fleet</text>
    </g>
    <g transform="translate(20, 155)">
      <rect width="280" height="28" rx="6" fill="#1e293b"/>
      <text x="10" y="19" fill="#10B981" font-family="monospace" font-size="11">🇮🇳 Mumbai (ap-south-1) Sovereign</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(740, 200)">
    <path d="M 0 0 L 55 0" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="55,-6 67,0 55,6" fill="#10B981"/>
    <text x="10" y="-12" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Live API</text>
  </g>

  <!-- Step 3: Production Endpoint -->
  <g transform="translate(810, 105)">
    <rect width="250" height="210" rx="12" fill="url(#boxGrad)" stroke="#10B981" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="36" rx="12" fill="#10B981" fill-opacity="0.15"/>
    <text x="18" y="24" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">🌍 Production LAPI Endpoint</text>
    
    <text x="16" y="65" fill="#64748B" font-family="monospace" font-size="10">ENDPOINT URL</text>
    <text x="16" y="82" fill="#38BDF8" font-family="monospace" font-size="11">api.tryliate.com/v1/</text>
    <text x="16" y="98" fill="#F8FAFC" font-family="monospace" font-size="11">u/{id}/agents/{agent}/run</text>
    
    <rect x="16" y="125" width="218" height="65" rx="8" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <text x="28" y="148" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold">₹ Real-Time Billing</text>
    <text x="28" y="168" fill="#A7F3D0" font-family="monospace" font-size="11">Token + Compute (Paise)</text>
  </g>
</svg>
