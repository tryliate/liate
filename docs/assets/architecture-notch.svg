  <text x="50" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Declarative, Universal Agent Standard Executable Across TypeScript, Python, Go &amp; MicroVMs</text>

