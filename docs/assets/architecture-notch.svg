  <!-- L: Model -->
  <g transform="translate(50, 95)">
    <rect width="180" height="240" rx="12" fill="url(#pL)" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="90" cy="38" r="22" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="82" y="47" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900">L</text>
    <text x="90" y="85" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">Language Model</text>
    <text x="90" y="105" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="12">LiateModel</text>
    <line x1="20" y1="120" x2="160" y2="120" stroke="#334155" stroke-width="1"/>
    <text x="20" y="145" fill="#CBD5E1" font-family="monospace" font-size="11">• Sarvam 105B</text>
    <text x="20" y="165" fill="#CBD5E1" font-family="monospace" font-size="11">• Anthropic Claude</text>
    <text x="20" y="185" fill="#CBD5E1" font-family="monospace" font-size="11">• Google Gemini</text>
    <text x="20" y="205" fill="#CBD5E1" font-family="monospace" font-size="11">• Ollama / Local</text>
    <text x="20" y="225" fill="#60a5fa" font-family="monospace" font-size="11">• OmniRoute (340+)</text>
