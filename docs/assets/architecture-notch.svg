    <rect width="1000" height="55" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="500" y="34" text-anchor="middle" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">
      ⚡ Universal Execution Runtime: <tspan fill="#FF9E00">Local LAPI/v1 Engine (:7071)</tspan> ⇄ <tspan fill="#38BDF8">Cloud MicroVM Runtime (Mumbai ap-south-1)</tspan>
    </text>
