    <text x="20" y="185" fill="#CBD5E1" font-family="monospace" font-size="11">• Custom Functions</text>
    <text x="20" y="205" fill="#CBD5E1" font-family="monospace" font-size="11">• Skills.sh Registry</text>
    <text x="20" y="225" fill="#00F0FF" font-family="monospace" font-size="11">• Streamable MCP</text>
