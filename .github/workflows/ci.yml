name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test (Bun Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeScript Type Check
        run: bun run typecheck

      - name: Build Distribution Bundle
        run: bun run build

      - name: Compile Native Binary
        run: bun build ./packages/cli/src/index.ts --compile --outfile liate-linux

      - name: Run Test Suite
        run: bun test
        env:
          CI: 'true'
          SARVAM_API_KEY: sk-test-dummy
          ANTHROPIC_API_KEY: sk-test-dummy
          GROQ_API_KEY: sk-test-dummy

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: liate-binary-linux
          path: liate-linux
          retention-days: 30
