name: Deploy to Deno Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Sovereign Edge Engine
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Uses GitHub Actions OIDC for authentication with Deno Deploy
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: liate
          entrypoint: main.ts
